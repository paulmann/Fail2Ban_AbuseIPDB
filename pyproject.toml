[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fail2ban-abuseipdb-reporter"
version = "1.1.0"
description = "Asynchronous fail2ban to AbuseIPDB reporter: queues bans in SQLite and submits rich, evidence-backed abuse reports on a schedule."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mikhail Deynekin" }]
keywords = [
    "fail2ban",
    "abuseipdb",
    "abuse-reporting",
    "threat-intelligence",
    "intrusion-detection",
    "brute-force",
    "security",
    "systemd",
    "sqlite",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/paulmann/Fail2Ban_AbuseIPDB"
Repository = "https://github.com/paulmann/Fail2Ban_AbuseIPDB"
Issues = "https://github.com/paulmann/Fail2Ban_AbuseIPDB/issues"
Changelog = "https://github.com/paulmann/Fail2Ban_AbuseIPDB/blob/main/CHANGELOG.md"

[project.scripts]
abuseipdb-report = "abuseipdb_reporter.cli:main_report"
abuseipdb-enqueue = "abuseipdb_reporter.cli:main_enqueue"
abuseipdb-upgrade = "abuseipdb_reporter.cli:main_upgrade"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abuseipdb_reporter = ["py.typed"]