zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 97e5517787954a789e557b15363b9d82
      name: Templates/Applications
  templates:
    - uuid: b2dfb2b6aa0d4984adb611d5d4f354ec
      template: Fail2Ban AbuseIPDB reporter
      name: 'Fail2Ban AbuseIPDB reporter'
      vendor:
        name: paulmann/Fail2Ban_AbuseIPDB
        version: '1.5.0'
      description: |
        Fail2Ban -> AbuseIPDB reporter: queue, budget, cluster role and failover lease.
        
        Every item is one agent call: `fail2ban.abuseipdb.metric[<name>]` runs
        `abuseipdb-report --metric <name>`, which prints one value out of the snapshot
        the reporter writes after each run (/var/lib/abuseipdb/metrics.json). No
        preprocessing on the server side, so a missing value is visible as 'unsupported'
        instead of a silently empty item.
        
        Requires monitoring/zabbix/userparameter_fail2ban_abuseipdb.conf in
        zabbix_agent2.d/ and a `zabbix` user able to run the CLI (see docs/ZABBIX.md).
        
        Triggers are tagged `server={HOST.HOST}` and `service=fail2ban-abuseipdb`, so a Zabbix
        service per server can match them in the Services tree.
      groups:
        - name: Templates/Applications
      items:
        - uuid: a7397734fa494e28a41e6bc437e9789f
          name: 'Pending events'
          key: 'fail2ban.abuseipdb.metric[pending_events]'
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Ban events waiting for a report.'
          triggers:
            - uuid: 91f1e966fc274a10bc21a96304c51ae9
              expression: last(/Fail2Ban AbuseIPDB reporter/fail2ban.abuseipdb.metric[pending_events])>{$ABUSEIPDB.PENDING.MAX}
              name: 'Fail2Ban AbuseIPDB: queue is growing'
              priority: WARNING
              description: 'Pending events keep growing: check the budget, the key and the log.'
              tags:
                - tag: server
                  value: '{HOST.HOST}'
                - tag: service
                  value: fail2ban-abuseipdb
        - uuid: f97e6af2f2964f63a5686e4cd45375d1
          name: 'Unpushed events'
          key: 'fail2ban.abuseipdb.metric[unpushed_events]'
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Follower: events not delivered to the leader.'
          triggers:
            - uuid: 4e324e6bf37c4b968f491548bd28ad40
              expression: last(/Fail2Ban AbuseIPDB reporter/fail2ban.abuseipdb.metric[unpushed_events])>500
              name: 'Fail2Ban AbuseIPDB: unpushed backlog'
              priority: AVERAGE
              description: 'The follower keeps events that never reached the leader.'
              tags:
                - tag: server
                  value: '{HOST.HOST}'
                - tag: service
                  value: fail2ban-abuseipdb
        - uuid: b4d34e0b139d4848a2e523e966efd6d6
          name: 'Reported cache entries'
          key: 'fail2ban.abuseipdb.metric[reported_cache_entries]'
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Addresses reported by the cluster inside the dedupe window.'
        - uuid: 00ec76a8e33b475b8361842486c72761
          name: 'Reports today'
          key: 'fail2ban.abuseipdb.metric[reports_today]'
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Reports accepted since the budget day started.'
        - uuid: 478b888afecb48b09bdff482a65d5bdb
          name: 'Daily budget'
          key: 'fail2ban.abuseipdb.metric[max_per_day]'
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Configured daily report budget.'
        - uuid: 148b51d630f74faaad8141d7e38f2e9b
          name: 'Budget remaining'
          key: 'fail2ban.abuseipdb.metric[budget_remaining]'
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Reports still allowed today.'
          triggers:
            - uuid: 87c5791bb0b1401b9cf949cfe525dfc6
              expression: last(/Fail2Ban AbuseIPDB reporter/fail2ban.abuseipdb.metric[budget_remaining])=0
              name: 'Fail2Ban AbuseIPDB: daily budget exhausted'
              priority: WARNING
              description: 'Reports stopped for today; the queue drains after midnight UTC.'
              tags:
                - tag: server
                  value: '{HOST.HOST}'
                - tag: service
                  value: fail2ban-abuseipdb
        - uuid: ee1a5da0c69b4cacbc951886b161f945
          name: 'Last run age'
          key: 'fail2ban.abuseipdb.metric[last_run_age_seconds]'
          delay: 5m
          value_type: FLOAT
          units: 's'
          history: 7d
          trends: 90d
          description: 'Seconds since the last reporter run.'
          triggers:
