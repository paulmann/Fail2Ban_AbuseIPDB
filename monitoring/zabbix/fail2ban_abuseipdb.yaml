        - uuid: c2a98c775e0246559d99d96b366b4e01
          name: 'Sync cursor lag'
          key: 'fail2ban.abuseipdb.metric[coord_cursor_lag_seconds]'
          delay: 5m
          value_type: FLOAT
          units: 's'
          history: 7d
          trends: 90d
          description: 'Follower: seconds since the leader cursor was refreshed.'
        - uuid: 0ab7022f131f48c1a824ceca555847d2
          name: 'Last sync age'
