# Fail2Ban action: queue every new ban for asynchronous AbuseIPDB reporting.
#
# The actual API call is performed later by /usr/local/sbin/abuseipdb-report
# (systemd timer or cron), so an unavailable or rate-limited AbuseIPDB never
# delays or breaks the ban itself.
#
# Only safe, fail2ban-generated values are passed to the command; log lines are
# never interpolated into a shell command (they are read from fail2ban's own
# database by the reporter instead).
[Definition]

# Do not queue bans that were merely restored from fail2ban's database on restart.
norestored = 1

actionstart =
actionstop =
actioncheck =

actionban = <enqueue> --ip '<ip>' --jail '<name>' --bantime '<bantime>' --failures '<failures>' || true

actionunban =

[Init]

# Path to the queueing helper (installed by install.sh).
enqueue = /usr/local/sbin/abuseipdb-enqueue