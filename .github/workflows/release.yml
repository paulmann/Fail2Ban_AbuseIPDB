name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v1.2.0); must already exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    # Must match "Environment name" in the PyPI trusted publisher exactly; an
    # empty field there means no environment here at all, and a mismatch ends in
    # 403 invalid-publisher on upload.
    environment: pypi
    # Job-level permissions replace the file-level ones, so both are repeated:
    # contents = create the release, id-token = OIDC for PyPI.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the tag and version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) version="${tag#v}" ;;
            *) echo "tag must look like v1.2.3, got '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $tag (version $version)"

      - name: Verify that the version is consistent
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          check() {  # file, grep pattern, human name
            if ! grep -qE "$2" "$1"; then
              echo "::error file=$1::$3 does not match $version"
              exit 1
            fi
            echo "ok: $1 ($3)"
          }
          check install.sh "^VERSION=\"$version\"$" "VERSION"
          check pyproject.toml "^version = \"$version\"$" "project version"
          check src/abuseipdb_reporter/__init__.py "^__version__ = \"$version\"$" "__version__"
          if ! grep -qE "\"version\": \"$version\"" updater.json; then
            echo "::warning file=updater.json::updater.json still advertises another version; update it with the published checksum after the release"
          fi

      - name: Unit tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -t .

      - name: CLI smoke test
        run: |
          python bin/abuseipdb-report --help > /dev/null
          python bin/abuseipdb-enqueue --help > /dev/null
          python bin/abuseipdb-upgrade --version

      - name: Build the release tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          asset="Fail2Ban_AbuseIPDB-$version.tar.gz"
          git archive --format=tar.gz --prefix="Fail2Ban_AbuseIPDB-$version/" \
            --output="$asset" "${{ steps.v.outputs.tag }}"
          # sed, not head: head closes the pipe and tar dies of SIGPIPE under pipefail
          tar tzf "$asset" | sed -n '1,5p'
          sha256sum "$asset" | tee asset.sha256

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      # Trusted publishing: no password, no stored token. GitHub mints a
      # short-lived OIDC token and PyPI exchanges it for an upload token scoped
      # to this repository, this workflow and the pypi environment.
      #
      # PyPI files are immutable: a second upload of the same version answers
      # "400 File already exists". Re-running this workflow for an already
      # published tag is a normal operation (for example after the GitHub
      # release step failed halfway), and it must not look like a broken
      # release. Ask PyPI first and name the reason the upload is skipped; a
      # version that is missing (404) is published by the next step.
      - name: Check whether this version is already on PyPI
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          project="fail2ban-abuseipdb-reporter"
          version="${{ steps.v.outputs.version }}"
          url="https://pypi.org/pypi/$project/$version/json"
          # 404 is an answer here, not a curl failure, and --output /dev/null
          # keeps the JSON body out of the log.
          code="$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' "$url" || true)"
          case "$code" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "$project $version is already on PyPI ($url answered HTTP 200): upload skipped, PyPI files are immutable"
              {
                echo "### PyPI: version already published, nothing was uploaded"
                echo
                echo "\`$project $version\` is already on PyPI (\`$url\` answered HTTP 200)."
                echo "Re-running the release for an already published tag is the usual cause."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "$project $version is not on PyPI yet ($url answered HTTP 404): the upload step publishes it"
              ;;
            *)
              # Guessing here would either hide a broken index or duplicate a
              # release: stop and show what PyPI answered.
              echo "::error::cannot tell whether $project $version is on PyPI: $url answered HTTP ${code:-nothing}"
              exit 1
              ;;
          esac

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          version="${{ steps.v.outputs.version }}"
          # A re-run must not fail here either: an existing release and its
          # assets are published artefacts. They are left untouched, not
          # replaced, and the log says so.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "GitHub release $tag already exists: left untouched (published assets are immutable)"
            {
              echo "### GitHub release: already exists, nothing was created"
              echo
              echo "\`$tag\` is already published; this run did not replace it or its assets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          notes="docs/release-notes-$version.md"
          extra=()
          if [ -f "$notes" ]; then
            extra+=(--notes-file "$notes")
          else
            extra+=(--generate-notes)
          fi
          gh release create "$tag" \
            "Fail2Ban_AbuseIPDB-$version.tar.gz#Installer tarball (used by abuseipdb-upgrade)" \
            dist/*.whl dist/*.tar.gz \
            --title "v$version" "${extra[@]}"

      - name: Show the checksum for updater.json
        shell: bash
        run: |
          version="${{ steps.v.outputs.version }}"
          sha="$(cut -d' ' -f1 asset.sha256)"
          {
            echo "### updater.json for v$version"
            echo
            echo '```json'
            echo '{'
            echo '  "version": "'"$version"'",'
            echo '  "tarball": "https://github.com/'"${{ github.repository }}"'/releases/download/v'"$version"'/Fail2Ban_AbuseIPDB-'"$version"'.tar.gz",'
            echo '  "sha256": "'"$sha"'"'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
