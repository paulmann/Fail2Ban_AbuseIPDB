name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v1.2.0); must already exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the tag and version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) version="${tag#v}" ;;
            *) echo "tag must look like v1.2.3, got '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $tag (version $version)"

      - name: Verify that the version is consistent
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          check() {  # file, grep pattern, human name
            if ! grep -qE "$2" "$1"; then
              echo "::error file=$1::$3 does not match $version"
              exit 1
            fi
            echo "ok: $1 ($3)"
          }
          check install.sh "^VERSION=\"$version\"$" "VERSION"
          check pyproject.toml "^version = \"$version\"$" "project version"
          check src/abuseipdb_reporter/__init__.py "^__version__ = \"$version\"$" "__version__"
          if ! grep -qE "\"version\": \"$version\"" updater.json; then
            echo "::warning file=updater.json::updater.json still advertises another version; update it with the published checksum after the release"
          fi

      - name: Unit tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -t .

      - name: CLI smoke test
        run: |
          python bin/abuseipdb-report --help > /dev/null
          python bin/abuseipdb-enqueue --help > /dev/null
          python bin/abuseipdb-upgrade --version

      - name: Build the release tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          asset="Fail2Ban_AbuseIPDB-$version.tar.gz"
          git archive --format=tar.gz --prefix="Fail2Ban_AbuseIPDB-$version/" \
            --output="$asset" "${{ steps.v.outputs.tag }}"
          # sed, not head: head closes the pipe and tar dies of SIGPIPE under pipefail
          tar tzf "$asset" | sed -n '1,5p'
          sha256sum "$asset" | tee asset.sha256

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          version="${{ steps.v.outputs.version }}"
          notes="docs/release-notes-$version.md"
          extra=()
          if [ -f "$notes" ]; then
            extra+=(--notes-file "$notes")
          else
            extra+=(--generate-notes)
          fi
          gh release create "$tag" \
            "Fail2Ban_AbuseIPDB-$version.tar.gz#Installer tarball (used by abuseipdb-upgrade)" \
            dist/*.whl dist/*.tar.gz \
            --title "v$version" "${extra[@]}"

      - name: Show the checksum for updater.json
        shell: bash
        run: |
          version="${{ steps.v.outputs.version }}"
          sha="$(cut -d' ' -f1 asset.sha256)"
          {
            echo "### updater.json for v$version"
            echo
            echo '```json'
            echo '{'
            echo '  "version": "'"$version"'",'
            echo '  "tarball": "https://github.com/'"${{ github.repository }}"'/releases/download/v'"$version"'/Fail2Ban_AbuseIPDB-'"$version"'.tar.gz",'
            echo '  "sha256": "'"$sha"'"'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
